---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rightpath-app-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rightpath-app-backend
  template:
    metadata:
      labels:
        app: rightpath-app-backend
    spec:
      imagePullSecrets:
      - name: acr-secret
      hostAliases:
       - ip: "4.187.178.140"
         hostnames:
         - "apis.rightpath.com"
         - "labs.rightpath.com"         

      containers:
      - name: rightpath-app-backend
        image: rprighpathacr1.azurecr.io/rightpath-app-backend:43
        command: ["java", "-jar", "rightpath.jar", "--spring.config.location=/etc/config/application.properties"]
        ports:
        - containerPort: 8081
        volumeMounts:
        - name: backend-config-volume
          mountPath: /etc/config/application.properties
          subPath: application.properties
        env:
        # MySQL Configuration
        - name: MYSQL_HOST
          value: "rp-mysql-3.mysql.database.azure.com"
        - name: MYSQL_PORT
          value: "3306"          
        # Cross-pod websocket relay: needed before replicas > 1 (see RedisBrokerRelay).
        # - name: APP_WEBSOCKET_REDIS_RELAY_ENABLED
        #   value: "true"
        # - name: SPRING_DATA_REDIS_HOST
        #   value: "<redis-host>"
        # - name: SPRING_DATA_REDIS_PORT
        #   value: "6379"
        # The same Redis switch also shares interview state (answer de-duplication, audio chunk
        # numbering) between pods; with it off that state is per pod (see SharedStateStore).
        # MySQL read replica: read-only transactions are routed to it, everything else stays on the
        # primary (see ReadReplicaDataSourceConfig). Off unless enabled.
        # - name: APP_DATASOURCE_REPLICA_ENABLED
        #   value: "true"
        # - name: APP_DATASOURCE_REPLICA_JDBC_URL
        #   value: "jdbc:mysql://<replica-host>:3306/Rightpath?useSSL=true"
        # - name: APP_DATASOURCE_REPLICA_USERNAME
        #   value: "<replica-user>"
        # - name: APP_DATASOURCE_REPLICA_PASSWORD
        #   valueFrom: { secretKeyRef: { name: <secret>, key: <key> } }
                 
      volumes:
      - name: backend-config-volume
        configMap:
          name: backend-config